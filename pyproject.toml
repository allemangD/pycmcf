[project]
name = "pycmcf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "vtk~=9.7",
    "torch~=2.14",
    "pykeops~=2.3",
    "itk~=5.4",
    "libigl~=2.6",
    "numpy~=2.5",
    "scikit-sparse~=0.5.0",
    "scipy~=1.17",
    "deformetrica~=4.3",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
deformetrica = { workspace = true }

[tool.uv.workspace]
members = ["ext/*"]

[dependency-groups]
dev = [
    "ruff",
    "scipy-stubs",
]
