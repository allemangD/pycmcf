[project]
name = "pycmcf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Allemang", email = "david.allemang@kitware.com" }
]
requires-python = ">=3.13"
dependencies = [
    "tqdm",
    "scipy",
    "numpy",
    "vtk",
    "libigl",
]

[project.scripts]
pycmcf = "pycmcf.main:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
